<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時空貿易商：代數與幾何的冒險</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --success: #2ecc71;
            --danger: #e74c3c;
            --light: #ecf0f1;
            --bg-stage1: linear-gradient(135deg, #1e272e, #2c3e50);
            --bg-stage2: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: var(--bg-stage1);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 1s ease;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .hud {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            background: rgba(0,0,0,0.3);
            padding: 10px 15px;
            border-radius: 8px;
        }
        .progress-bar-container {
            background: #34495e;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-bar {
            background: var(--accent);
            width: 0%;
            height: 100%;
            transition: width 0.3s ease;
        }
        .story-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-left: 5px solid var(--accent);
            margin-bottom: 20px;
            font-style: italic;
            line-height: 1.6;
        }
        .question-box {
            font-size: 1.3rem;
            margin-bottom: 25px;
            font-weight: bold;
            line-height: 1.5;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            text-align: left;
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            text-align: center;
        }
        .feedback.correct {
            background: var(--success);
            display: block;
        }
        .feedback.wrong {
            background: var(--danger);
            display: block;
        }
        .next-btn {
            display: none;
            width: 100%;
            background: #2980b9;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        .next-btn:hover { background: #3498db; }
        .screen { display: none; }
        .screen.active { display: block; }
        .center { text-align: center; }
        .restart-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
<script type='text/javascript' src='https://private-us-east-1.manuscdn.com/iCpoGo2RTg40v-KjwFzEC_WJ07pwbNzsEAMv_zxSOSQI0h73uNUCa8QTcCRWmJ7SrelHz3nNfR2ioj92iPjl1SrjlBgufrZugSVAScEDzvDyLRoZaDEY1oHmPsrt7M2pONmTiDj1MfFHT9LO3glzE1Lsz1ot5OvvmflVj9rSdaU6WvXKi2M9A8TJQOmgB8Ys9Nt_iy7ss-2Gec_PYlD7EP-3iv7gXqFJWggNsAfJn41106WsP5trx_9-DUHOjqsbP4H9hkGyI1ovpQZg-U_hUJSHoBxsvqoAPtf7gyhzOzXDkBiBbnal97SC7cdI0vJr7AwuO8jmdUS5BhdSWHf-kQnPy-qYc74EXEyONwcNgtBdvAGRGCfNsFK9THb2D0LXM3BcfZkIbUiu3uqlNxMV8rVUAWEU2n2OIEHxS2D5icPNT3BnudTHDNSlDEAmys3Xz7Qz8l4WVIJqjBu9Cg6uPMrJm_ocCDm_RtnTqOWYPa0EFHunCeH_XDIzBed_cay9yBwpGOKLhRTR6cttSep99xQdtcYU1752DG7ri7wJWoYfnUG3ZGhOunvOstPkUMfIWE2TcI8NTibKy3u6trAO0mmI8ZuwGafcO3E5JmACf0G2mTThjNaIJ2u1RH5e4M3OM8LgWmQMQXA__Y94JCU2nQ3b5LImRNZXhc67BxKLvtZC_MMXOphRzCUZGleKC31ucQi1RbUsaxa26Pyh4vEw34mROd7oghnFx8nL18ZvTGmWoq3C1mXGTSpRzRlLkCKBwAmsNh4p-Kg2faIolZbHgDS8EfwvpOH1tkZbzlkn9zZwYNItu4ih0j6__yR_a1yHtHTkuhaQLgkLWkCWWVBY1j43ql7P1UeMsbiz2I4sL4PGdNKmU7R8_UDhair544ODG3p5fHkqo508BDpkLkN0pVi7barsJD3DGphxp2Y5xG7Wy_UhwoyTj1fVV6tZ9NyjVVS7JhfV_CqDemj0JnAvk95OQRCzOGkk9xHP4byYUzHNdRSQqqNtNEaSW_QRm3FlbX-B98-X4gcZwepeg0ytB1HlVlxd5CuP6Y813PZxaKVb_p0ueLOSufXcuKmvfDifeJ8__2STJmNufZewKd_IyEU6APNZr1qa7UroqDezLAzw5MQDEM0akIuiH6VgbltJlitWegAMwIidXW8DH2_QFRlcl_OUBuiNhtXJtkLnX41EJxO0AgCh3Ix5WHd-37TbpQ9JllHYwvInKNJ8H2xNb50HG1joRIa05UF_O7xClimifXarJx3pEiSNcms4VGbRQvGEFIIZSmSjmJF9wb9YzLrx66IsrQyJiDPoyM1FE-5TmyKXxTKZM6XzhE9xd3Ei08RSgsuxD6_bcXK2p-3Q3Aup3M8y'></script></head>
<body>

<div class="game-container">
    <!-- 遊戲進行主畫面 -->
    <div id="game-screen" class="screen active">
        <div class="hud">
            <div>❤️ 血量: <span id="hp">3</span>/3</div>
            <div>🪙 金幣: <span id="coins">0</span></div>
            <div>🏰 區域: <span id="stage-name">古代商號</span></div>
        </div>
        <div class="progress-bar-container">
            <div id="progress" class="progress-bar"></div>
        </div>
        <div id="story" class="story-box"></div>
        <div id="question" class="question-box"></div>
        <div id="options" class="options-container"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-btn" class="next-btn" onclick="nextQuestion()">前往下一題 ➔</button>
    </div>

    <!-- 遊戲結束畫面 -->
    <div id="end-screen" class="screen center">
        <h2 id="end-title">💥 時空傳送失敗！</h2>
        <p id="end-desc">看來需要再鍛煉一下數學公式，才能穩定時空矩陣...</p>
        <p style="font-size: 1.5rem;">最終金幣：🪙 <span id="final-coins">0</span></p>
        <button class="restart-btn" onclick="restartGame()">重新挑戰</button>
    </div>
</div>

<script>
    // 題目資料庫 (第一關：數與代數 + 第二關：圖形與空間)
    const questions = [
        // ======= 第一關：古代商號 =======
        {
            stage: "第一關：古代商號",
            bg: "var(--bg-stage1)",
            story: "📜 掌櫃正在愁眉苦臉地盤點絲綢，看到你便急忙前來求助...",
            question: "「客官！庫存原有些絲綢，下午賣出 1.25 匹，傍晚進貨了賣出量的 2/3 後，庫存剩下 5.5 匹。請問最一開始庫存有多少匹？」",
            options: ["6.75 匹", "5.92 匹", "6.33 匹", "4.25 匹"],
            correct: 1, 
            reward: 100,
            tip: "💡 提示：逆向思考！現在的 5.5 匹，扣掉進貨的 (1.25 × 2/3 = 0.833) 匹，再加回賣出的 1.25 匹，就是原來的庫存喔！"
        },
        {
            stage: "第一關：古代商號",
            bg: "var(--bg-stage1)",
            story: "💰 解決了絲綢問題，掌櫃帶你來到高檔瓷器櫃檯，商量定價策略。",
            question: "「這件精美的波斯瓷器打『七五折』出售後，我們還能賺取『二成（20%）』的利潤。已知這件瓷器的成本是 500 文，那原本的定價應該是多少文？」",
            options: ["600 文", "750 文", "800 文", "1000 文"],
            correct: 2, 
            reward: 150,
            tip: "💡 提示：先算售價！利潤二成代表售價是成本的 120% (500 × 1.2 = 600 文)。再用售價除以折數 (600 ÷ 0.75) 就能算出定價！"
        },
        {
            stage: "第一關：古代商號",
            bg: "var(--bg-stage1)",
            story: "🧪 商號後院正在調配防禦盜賊的煙霧彈，比例非常關鍵！",
            question: "「神秘煙霧彈需要硝石與硫磺的比為 5 : 3。現在工作台上已經稱好了 45 克的硫磺，我們需要加入多少克的硝石才能完美調配？」",
            options: ["27 克", "75 克", "60 克", "135 克"],
            correct: 1, 
            reward: 120,
            tip: "💡 提示：利用比的性質！硫磺從 3 份變成 45 克放大了 15 倍（45 ÷ 3 = 15），所以硝石的 5 份也要放大 15 倍（5 × 15）喔！"
        },
        {
            stage: "第一關：古代商號",
            bg: "var(--bg-stage1)",
            story: "🔒 掌櫃非常器重你，決定交給你一個神秘的時空寶箱，但上面鎖著複雜的代數機關...",
            question: "寶箱銘文寫著：「鎖中機關有未知數 x。若將 x 乘以 3，再減去 15，剛好會等於 45。」請問密碼 x 是多少？",
            options: ["x = 10", "x = 30", "x = 20", "x = 15"],
            correct: 2, 
            reward: 200,
            tip: "💡 提示：列出方程 3x - 15 = 45。兩邊同時加上 15 得到 3x = 60，再同時除以 3 就能解出 x 囉！"
        },
        
        // ======= 第二關：幾何神殿 =======
        {
            stage: "第二關：幾何神殿",
            bg: "var(--bg-stage2)",
            story: "🧭 一陣光芒閃過，你傳送到了青苔密佈的古老神殿。地面刻著巨大的羅盤，石壁上寫著尋路線索...",
            question: "「從神殿中央出發，向北偏東 30° 方向前進 10 米到達第一個機關。隨後，若想回到正北方向的中央軸線上，你應該做出什麼調整？」",
            options: [
                "向正南方向移動 10 米",
                "向正西方向移動 5 米",
                "向南偏西 30° 方向移動 10 米",
                "向正東方向移動 5 米"
            ],
            correct: 1, // 東向偏移 10 × sin(30°) = 5 米，因此向正西移動 5 米回到中央軸線。
            reward: 200,
            tip: "💡 提示：利用方向與位置概念！你往東偏了出去。在含有 30° 角的直角三角形中，30° 所對的直角邊（也就是你偏東的距離）正好是斜邊（10米）的一半，即 5 米。所以要往正西走 5 米才能回正！"
        },
        {
            stage: "第二關：幾何神殿",
            bg: "var(--bg-stage2)",
            story: "⭕ 神殿正中央的圓形封印大門少了一塊扇形拼圖。石壁上寫著：『非求得此缺口面積者，不得入內。』",
            question: "已知圓形大門的半徑為 6 米，缺口的扇形圓心角正好是 120°。請問這個缺口扇形的面積是多少平方公尺？（圓周率 π 請以 3.14 計算）",
            options: [
                "113.04 平方公尺",
                "37.68 平方公尺",
                "18.84 平方公尺",
                "75.36 平方公尺"
            ],
            correct: 1, // 面積 = 3.14 * 6 * 6 * (120/360) = 3.14 * 36 / 3 = 3.14 * 12 = 37.68
            reward: 250,
            tip: "💡 提示：扇形面積公式 = 圓面積 × (圓心角 / 360°)。整個圓的面積是 3.14 × 6 × 6 = 113.04。因為 120° 剛好是整個圓的三分之一（120/360 = 1/3），所以用 113.04 ÷ 3 = 37.68 平方公尺！"
        },
        {
            stage: "第二關：幾何神殿",
            bg: "var(--bg-stage2)",
            story: "📦 通往深處的走廊被一個巨大的長方體石台擋住。必須為它塗上特殊的導電塗層才能將其沉入地下。",
            question: "石台的尺寸為：長 5 公尺、寬 4 公尺、高 3 公尺。請問這個長方體石台的『表面積』是多少平方公尺？",
            options: [
                "60 平方公尺",
                "94 平方公尺",
                "47 平方公尺",
                "120 平方公尺"
            ],
            correct: 1, // 2 * (5*4 + 5*3 + 4*3) = 2 * (20 + 15 + 12) = 2 * 47 = 94
            reward: 250,
            tip: "💡 提示：長方體表面積公式 = (長×寬 + 長×高 + 寬×高) × 2。計算得出 (5×4 + 5×3 + 4×3) = 20 + 15 + 12 = 47。再乘以 2 得到 94 平方公尺！"
        },
        {
            stage: "第二關：幾何神殿",
            bg: "var(--bg-stage2)",
            story: "🏺 你終於來到了幾何神殿的核心能源槽。這裡有一個巨型圓柱體容器，你必須計算出它的容積來精確注入時空能量液。",
            question: "已知圓柱體能源槽的『底面半徑』為 2 公尺，『高』為 5 公尺。請問它的體積是多少立方公尺？（圓周率 π 請以 3.14 計算）",
            options: [
                "62.8 立方公尺",
                "31.4 立方公尺",
                "12.56 立方公尺",
                "20 立方公尺"
            ],
            correct: 0, // 體積 = 底面積 * 高 = (3.14 * 2 * 2) * 5 = 12.56 * 5 = 62.8
            reward: 300,
            tip: "💡 提示：圓柱體體積公式 = 底面積 × 高。先求圓形底面積：3.14 × 2 × 2 = 12.56 平方公尺。再乘以高度 5 公尺：12.56 × 5 = 62.8 立方公尺！"
        }
    ];

    let currentIdx = 0;
    let hp = 3;
    let coins = 0;
    let answered = false;
    let gameOver = false;
    let endTimer = null;

    function initGame() {
        if (endTimer !== null) {
            clearTimeout(endTimer);
            endTimer = null;
        }
        currentIdx = 0;
        hp = 3;
        coins = 0;
        answered = false;
        gameOver = false;
        document.getElementById('game-screen').classList.add('active');
        document.getElementById('end-screen').classList.remove('active');
        updateHUD();
        showQuestion();
    }

    function updateHUD() {
        document.getElementById('hp').textContent = hp;
        document.getElementById('coins').textContent = coins;
        const progressPercent = (currentIdx / questions.length) * 100;
        document.getElementById('progress').style.width = progressPercent + '%';
    }

    function showQuestion() {
        if (currentIdx >= questions.length) {
            endGame(true);
            return;
        }

        answered = false;
        const q = questions[currentIdx];
        document.body.style.background = q.bg;
        document.getElementById('stage-name').textContent = q.stage;
        document.getElementById('story').textContent = q.story;
        document.getElementById('question').textContent = q.question;

        const optionsDiv = document.getElementById('options');
        optionsDiv.replaceChildren();
        const feedbackDiv = document.getElementById('feedback');
        feedbackDiv.className = 'feedback';
        feedbackDiv.textContent = '';

        const nextBtn = document.getElementById('next-btn');
        nextBtn.style.display = 'none';
        nextBtn.textContent = currentIdx === questions.length - 1 ? '完成冒險 ➔' : '前往下一題 ➔';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.addEventListener('click', () => checkAnswer(idx));
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selectedIdx) {
        if (answered || gameOver) return;
        answered = true;

        const q = questions[currentIdx];
        const feedbackDiv = document.getElementById('feedback');
        document.querySelectorAll('.option-btn').forEach(btn => { btn.disabled = true; });

        if (selectedIdx === q.correct) {
            feedbackDiv.className = 'feedback correct';
            feedbackDiv.textContent = `🎉 答對了！獲得 🪙 ${q.reward} 金幣！`;
            coins += q.reward;
        } else {
            feedbackDiv.className = 'feedback wrong';
            feedbackDiv.innerHTML = `❌ 答錯了！受到時空震盪傷害。<br><br>${q.tip}`;
            hp--;
        }

        updateHUD();
        const nextBtn = document.getElementById('next-btn');
        if (hp <= 0) {
            gameOver = true;
            nextBtn.style.display = 'none';
            endTimer = setTimeout(() => {
                endTimer = null;
                endGame(false);
            }, 3000);
        } else {
            nextBtn.style.display = 'block';
        }
    }

    function nextQuestion() {
        if (!answered || gameOver) return;
        currentIdx++;
        updateHUD();
        showQuestion();
    }

    function endGame(isWin) {
        if (endTimer !== null) {
            clearTimeout(endTimer);
            endTimer = null;
        }
        gameOver = true;
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('end-screen').classList.add('active');
        document.getElementById('final-coins').textContent = coins;

        const title = document.getElementById('end-title');
        const desc = document.getElementById('end-desc');
        if (isWin) {
            title.textContent = '🏆 傳奇時空貿易商誕生！';
            title.style.color = 'var(--success)';
            desc.textContent = '你完美通過了「數與代數」與「圖形與空間」的雙重考驗！時空矩陣徹底穩定，你成為了最偉大的數學冒險家！';
            document.getElementById('progress').style.width = '100%';
        } else {
            title.textContent = '💥 時空傳送失敗！';
            title.style.color = 'var(--danger)';
            desc.textContent = '生命值歸零。幾何神殿的機關稍微複雜了一點，重整旗鼓，再來挑戰一次吧！';
        }
    }

    function restartGame() {
        initGame();
    }

    window.onload = initGame;
</script>
</body>
</html>
